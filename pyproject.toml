[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rest-clients-py"
version = "0.8.0"
description = "Notes and small building blocks for consuming REST APIs from Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Avery Lane" }]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The core runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
requests = ["requests>=2.32.3"]
httpx = ["httpx>=0.27.0"]
http2 = ["httpx[http2]>=0.27.0"]
aiohttp = ["aiohttp>=3.10.5"]
oauth = ["requests-oauthlib>=1.3.1"]

[tool.flit.module]
name = "restclients"
